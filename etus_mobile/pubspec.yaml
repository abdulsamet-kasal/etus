name: etus_mobile
description: "Edirne ETUS Akıllı Durak, Rota ve Google Maps Asistanı"
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Konum (GPS) servisi
  geolocator: ^12.0.0
  # Google Maps ve harici linkleri açma
  url_launcher: ^6.3.0
  # Modern arayüz ikonları
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
