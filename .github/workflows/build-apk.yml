name: Build & Release ETUS Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd etus_mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd etus_mobile
          flutter build apk --release

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: etus_mobile/build/app/outputs/flutter-apk/app-release.apk
          name: ETUS v1.0.0 - Edirne Akıllı Toplu Ulaşım Asistanı
